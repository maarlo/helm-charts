{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "excalidraw.fullname" . }}
  labels:
    {{- include "excalidraw.labels" (dict "ctx" . "component" "web") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - secretName: {{ .Values.ingress.web.tlsSecretName }}
      hosts:
        - {{ .Values.ingress.web.host | quote }}
    {{- if .Values.ingress.room.host }}
    - secretName: {{ default .Values.ingress.web.tlsSecretName .Values.ingress.room.tlsSecretName }}
      hosts:
        - {{ .Values.ingress.room.host | quote }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.web.host | quote }}
      http:
        paths:
          {{- if not .Values.ingress.room.host }}
          - path: /socket.io
            pathType: Prefix
            backend:
              service: { name: {{ include "excalidraw.fullname" . }}-room, port: { name: ws } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "excalidraw.fullname" . }}-web, port: { name: http } }
    {{- if .Values.ingress.room.host }}
    - host: {{ .Values.ingress.room.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "excalidraw.fullname" . }}-room, port: { name: ws } }
    {{- end }}
{{- end }}
