apiVersion: v1
kind: Service
metadata:
  name: {{ include "excalidraw.fullname" . }}-web
  labels:
    {{- include "excalidraw.labels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  selector:
    {{- include "excalidraw.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "excalidraw.fullname" . }}-room
  labels:
    {{- include "excalidraw.labels" (dict "ctx" . "component" "room") | nindent 4 }}
spec:
  selector:
    {{- include "excalidraw.selectorLabels" (dict "ctx" . "component" "room") | nindent 4 }}
  ports:
    - name: ws
      port: 80
      targetPort: ws
